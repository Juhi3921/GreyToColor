<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreyToColor</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: black;

            font-family: Arial, sans-serif;
        }


        /* Main image container */

        #contaigner {
            position: absolute;
            display: block;
        }


        /* Grey image */

        #contaigner .img_grey {
            display: block;

            width: 600px;
            height: auto;

            border-radius: 10px;

            filter: grayscale(100%);

            user-select: none;

            cursor: none;
        }


        /* Reveal area */

        #cursor {
            position: absolute;

            width: 200px;
            height: 200px;

            overflow: hidden;

            border-radius: 50%;

            background-color: transparent;

            border: 2px solid white;

            cursor: none;

            pointer-events: none;
        }


        /* Colored image */

        #img {
            position: absolute;

            width: 600px;
            height: auto;

            user-select: none;

            pointer-events: none;
        }
